<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" class="auron-logo-svg">
  <defs>
    <!-- Ambient Backdrop Glow -->
    <filter id="auron-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Plates -->
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Top Plate Obsidian Gradient -->
    <linearGradient id="topPlateGrad" x1="120" y1="80" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Top Plate Bevel Stroke -->
    <linearGradient id="topPlateStroke" x1="100" y1="60" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Middle Plate Azure Glass Gradient -->
    <linearGradient id="midPlateGrad" x1="120" y1="180" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Bottom Plate Deep Navy Gradient -->
    <linearGradient id="botPlateGrad" x1="120" y1="260" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <!-- Terminal Prompt Glow -->
    <filter id="prompt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Cyan Lighting Aura -->
  <ellipse cx="250" cy="240" rx="160" ry="110" fill="#00D2FF" fill-opacity="0.12" filter="url(#auron-glow)" />

  <!-- ========================================== -->
  <!-- 1. BOTTOM PLATE (Host Isolation Base)     -->
  <!-- ========================================== -->
  <g transform="translate(0, 160)" opacity="0.6">
    <path d="M 250 85 
             C 264 76, 276 76, 385 140 
             C 402 150, 402 166, 385 176 
             L 276 240 
             C 262 248, 238 248, 224 240 
             L 115 176 
             C 98 166, 98 150, 115 140 
             Z" 
          fill="url(#botPlateGrad)" 
          stroke="rgba(56, 189, 248, 0.2)" 
          stroke-width="1.5" />
  </g>

  <!-- ========================================== -->
  <!-- 2. MIDDLE PLATE (Docker Micro-Sandbox)    -->
  <!-- ========================================== -->
  <g transform="translate(0, 80)">
    <path d="M 250 85 
             C 264 76, 276 76, 385 140 
             C 402 150, 402 166, 385 176 
             L 276 240 
             C 262 248, 238 248, 224 240 
             L 115 176 
             C 98 166, 98 150, 115 140 
             Z" 
          fill="url(#midPlateGrad)" 
          stroke="rgba(0, 210, 255, 0.45)" 
          stroke-width="1.5" 
          filter="url(#plate-shadow)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. TOP PLATE (AI Agent & Terminal)        -->
  <!-- ========================================== -->
  <g transform="translate(0, 0)">
    <!-- Plate Body -->
    <path d="M 250 85 
             C 264 76, 276 76, 385 140 
             C 402 150, 402 166, 385 176 
             L 276 240 
             C 262 248, 238 248, 224 240 
             L 115 176 
             C 98 166, 98 150, 115 140 
             Z" 
          fill="url(#topPlateGrad)" 
          stroke="url(#topPlateStroke)" 
          stroke-width="2" 
          filter="url(#plate-shadow)" />

    <!-- Terminal Command Prompt: "> _" in Glowing Electric Cyan -->
    <!-- Chevron: ">" with isometric skew and rounded caps -->
    <path d="M 215 138 L 246 156 L 215 174" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#prompt-glow)" />

    <!-- Underscore/Cursor: "_" -->
    <path d="M 258 174 L 290 174" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="9" 
          stroke-linecap="round" 
          filter="url(#prompt-glow)" />
  </g>
</svg>

